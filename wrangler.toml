name = "resend-email-webhook"
main = "src/index.js"
compatibility_date = "2024-09-23"

# ─── 变量配置（重要！）────────────────────────────────────────
# 本项目所有环境变量统一在 Cloudflare Dashboard 中配置：
#   - 明文变量（FROM_EMAIL / TO_EMAIL / REPLY_TO）→ Settings → Variables
#   - 敏感密钥（RESEND_API_KEY）→ Settings → Secrets
#
# keep_vars = true 是关键：每次部署时保留 Dashboard 中已配置的变量，
# 不会被 wrangler.toml 覆盖或清空（避免"部署后变量被删"的问题）。
#
# ⚠️ 注意：仓库中不再包含任何变量值。新环境部署后，
#    必须先到 Dashboard 配置好变量，接口才能正常工作。

keep_vars = true

# ─── 可选：自定义路由 ────────────────────────────────────────
# 默认部署后访问地址为 https://resend-email-webhook.<你的子域>.workers.dev
# 如需自定义路由，取消注释并配置：
# routes = [
#   { pattern = "notify.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]
